name: Build Windows Desktop EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Windows EXE
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Recurse -Filter "package.json" | Select-Object -First 1
          if (-not $pkg) { throw "package.json tidak ditemukan!" }
          Set-Location $pkg.Directory.FullName
          Write-Host "Building di folder: $($pkg.Directory.FullName)"
          $json = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($json.build.PSObject.Properties['publish']) {
            $json.build.PSObject.Properties.Remove('publish')
          }
          if ($json.build.win -and $json.build.win.PSObject.Properties['artifactName']) {
            $json.build.win.PSObject.Properties.Remove('artifactName')
          }
          $json | ConvertTo-Json -Depth 10 | Set-Content "package.json" -Encoding UTF8
          npm install
          npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload EXE to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inspection-Workspace-Windows-EXE
          path: |
            **/dist/*.exe
